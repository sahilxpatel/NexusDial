services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: nexusdial
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspass
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

volumes:
  pg_data:
  redis_data:
